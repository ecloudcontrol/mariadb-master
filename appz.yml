app:
    name: mariadb Master
    code: mariadbmaster
    notify: rniranjan@cloudbourne.co

build:
    version: 11.4
    env: DEV
    build_file: none
    output_files: output/*.zip
    image_template: mariadb_master-11.4

deploy:
    context: plantmaster/DEV
    type: statefulset
    replicas: 1
    port:
    - 3306

volumes:
  - claim: mariadb-master-data
    class: linode-block-storage-retain
    mount: /appz/data/mysql
    name: data
    size: 5Gi
    matchLabels: false
  - claim: mariadb-master-backup
    class: linode-block-storage-retain
    mount: /appz/backup
    name: backup
    size: 5Gi
    matchLabels: false
  
properties:
    MYSQL_REPLICATION_USER: replication
    MYSQL_REPLICATION_PASSWORD:
      vault: MYSQL_REPLICATION_PASSWORD
    MYSQL_ROOT_PASSWORD:
      vault: MYSQL_ROOT_PASSWORD_KEY
    revision : 4
